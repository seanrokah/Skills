# Copies the ChiakiKit.xcframework artifact from a finished build run into the
# orphan branch relay-chiaki-artifacts, so it can be fetched with plain git.
# Edit RUN_ID below and push to relay-chiaki-build to sync another run.
name: Relay - sync xcframework artifact

on:
  push:
    branches: [relay-chiaki-build]
    paths:
      - ".github/workflows/relay-artifact-sync.yml"

permissions:
  contents: write
  actions: read

env:
  RUN_ID: "45894641539"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifact from build run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ChiakiKit-xcframework
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: payload

      - name: Verify hash
        working-directory: payload
        run: |
          set -euo pipefail
          ls -la
          sha256sum -c ChiakiKit.xcframework.zip.sha256

      - name: Commit to relay-chiaki-artifacts
        working-directory: payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "source run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > SOURCE.txt
          git init -q -b relay-chiaki-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "ChiakiKit.xcframework from run ${RUN_ID}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" relay-chiaki-artifacts
