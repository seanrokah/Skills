## -*- mode: perl; -*-
## openssl-tvos.conf -- extra OpenSSL "Configure" targets for tvOS.
##
## OpenSSL 3.5.x ships no tvOS targets (Configurations/15-ios.conf only has
## iOS ones). These two targets mirror "ios64-xcrun" and
## "iossimulator-arm64-xcrun" from that file, with the SDK switched to
## appletvos / appletvsimulator. Load with:
##   perl Configure --config=/path/to/openssl-tvos.conf tvos64-xcrun ...
## The deployment-target flag (-mtvos-version-min=... or
## -mtvos-simulator-version-min=...) is passed on the Configure command line.

my %targets = (
    "tvos64-xcrun" => {
        inherit_from     => [ "ios-common" ],
        CC               => "xcrun -sdk appletvos cc",
        cflags           => add("-arch arm64 -fno-common"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
    },
    "tvossimulator-arm64-xcrun" => {
        inherit_from     => [ "ios-common" ],
        CC               => "xcrun -sdk appletvsimulator cc",
        cflags           => add("-arch arm64 -fno-common"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
    },
);
